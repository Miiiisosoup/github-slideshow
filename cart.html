<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart - Nexroy</title>
    <meta name="description" content="Review items in your shopping cart at Nexroy. Proceed to checkout to purchase design services and products.">
    <meta name="keywords" content="shopping cart, Nexroy cart, design products, service checkout, view cart">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="main-nav">
        <a href="index.html" class="nav-brand">Nexroy</a>
        <button class="nav-toggle" aria-label="toggle navigation">
            <span class="hamburger"></span>
        </button>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart <span id="cart-count">0</span></a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <header class="page-header">
        <h1>Your Shopping Cart</h1>
    </header>

    <main class="cart-content">
        <div id="cart-items-container">
            <!-- Cart items will be dynamically inserted here by JavaScript -->
            <p id="empty-cart-message">Your cart is currently empty.</p>
        </div>

        <section class="cart-summary">
            <h2>Cart Totals</h2>
            <p>Subtotal: <span id="cart-subtotal">$0.00</span></p>
            <button id="clear-cart-btn">Clear Cart</button>
            <a href="checkout.html" class="button" id="checkout-btn">Proceed to Checkout</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Nexroy. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
